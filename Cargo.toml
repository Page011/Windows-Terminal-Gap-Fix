[package]
name = "wtgapfix"
version = "0.3.0"
edition = "2024"
description = "Removes the auto-hide taskbar gap on maximized/fullscreen Windows Terminal (microsoft/terminal#12959)"

# DLL that runs inside WindowsTerminal.exe and undoes the 2 px inset.
[lib]
name = "wtgapfix_hook"
crate-type = ["cdylib"]
path = "src/lib.rs"

# Loader: puts the DLL into each Terminal window, once.
[[bin]]
name = "wtgapfix"
path = "src/main.rs"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
